# Managed by chezmoi: dot_config/lazygit/config.yml.
#
# LG_CONFIG_FILE points here from fish and the PowerShell profile, because
# lazygit otherwise looks under ~/Library/Application Support on macOS and
# %APPDATA% on Windows.
gui:
  nerdFontsVersion: "3"
  # Catppuccin Mocha (mauve accent), copied from the upstream catppuccin/lazygit
  # port and matching the managed terminals, bat and every other CLI theme.
  theme:
    activeBorderColor:
      - "#cba6f7"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitFgColor:
      - "#cba6f7"
    cherryPickedCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    authorColors:
      "*": "#b4befe"
  # Keep the side panel wide enough for long branch names.
  sidePanelWidth: 0.3
# Do not ask twice when quitting.
confirmOnQuit: false
git:
  # Show the full commit message in the commits panel.
  log:
    order: topo-order
    showGraph: always
    showWholeGraph: false
