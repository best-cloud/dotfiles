# Managed by chezmoi. uv on Windows reads %APPDATA%\uv\uv.toml and ignores
# XDG_CONFIG_HOME, so this is the Windows copy of dot_config/uv/uv.toml. uv
# resolves and downloads through the TUNA PyPI proxy, but uv.lock records the
# canonical pypi.org and files.pythonhosted.org URLs. CI and machines without
# this user-level file therefore use PyPI directly and the same lock installs
# everywhere. Proxy indexes are a preview feature; drop preview-features once
# they stabilize.
preview-features = ["proxy-index"]

[[index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[[proxy-index]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
artifact-base-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/packages/"
proxy-for = "pypi"
